# Optional Level 2 LLM extraction settings.
#
# Editing guidance:
# - `model` is the default model when `OPENAI_MODEL` is not set in the env.
# - `task_models` overrides the default per task type — use cheaper models
#   for classification, reserve stronger models for complex tasks.
# - The text limits bound request size to control cost and runtime.
# - Keep `max_site_text_chars` larger than `max_page_text_chars`.

[openai]
enabled = true
model = "gpt-4o-mini"
request_timeout_seconds = 45
max_page_text_chars = 1800
max_site_text_chars = 8000
max_error_body_chars = 300

# Task-based model overrides.
# classification: lifecycle_stages, use_cases, icp_buyer, directory_fit
# extraction:     mission, usp, pricing, case_study_details (default path)
# complex:        reserved for future richer reasoning tasks
[task_models]
classification = "gpt-4o-mini"
extraction = "gpt-4o-mini"
complex = "gpt-4o"
default = "gpt-4o-mini"
